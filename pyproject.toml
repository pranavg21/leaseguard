[project]
name = "leaseguard"
version = "2.0.0"
description = "Clause-level risk review for Indian residential rental agreements, with verified quotes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "pypdf>=6,<7",
  "reportlab>=4.1,<5",
  "google-genai>=1.30,<3",
  "google-cloud-firestore>=2.16,<3",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "pylint>=3.2"]

[tool.setuptools]
packages = ["leaseguard", "leaseguard.ai", "leaseguard.api", "leaseguard.rules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning", "ignore:ARC4:UserWarning", "ignore::cryptography.utils.CryptographyDeprecationWarning"]

[tool.coverage.run]
source = ["leaseguard", "scripts"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = ["if __name__ == .__main__.:", "\\.\\.\\.$"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203", "D213", "COM812", "ISC001",  # formatter / docstring-style conflicts
  "FBT001", "FBT002",                  # boolean fields in dataclasses are intentional
  "TRY003", "EM101", "EM102",          # short user-facing error messages are clearer inline
  "PLR2004",                           # checked by tests; constants live in leaseguard/constants.py
  "RUF001", "RUF003",                  # rupee sign and typographic quotes are intentional
  "CPY001",                            # licence is declared once in LICENSE
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "FBT003", "TRY301", "ANN401", "PLR0913", "SLF001", "ARG002", "INP001", "S105", "PT011", "N802", "PLC0415", "S311"]
"scripts/**" = ["T201"]
"leaseguard/sample.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["leaseguard", "scripts"]

[[tool.mypy.overrides]]
module = ["reportlab.*", "google.cloud.*"]
ignore_missing_imports = true

[tool.pylint.main]
disable = "all"
enable = ["duplicate-code"]

[tool.pylint.similarities]
min-similarity-lines = 4
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
